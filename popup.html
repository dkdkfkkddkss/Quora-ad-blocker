<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quora Ad Shield</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 300px;
      margin: 0;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      box-sizing: border-box;
    }
    h1 { font-size: 15px; margin: 0 0 2px; }
    .ver { color: #888; font-size: 11px; margin-bottom: 10px; }
    .row {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 7px 8px; border-radius: 8px;
    }
    .row:hover { background: rgba(128,128,128,0.12); }
    .row input { margin-top: 2px; }
    .row .t { flex: 1; }
    .row .name { font-weight: 600; }
    .row .desc { color: #888; font-size: 11px; margin-top: 1px; }
    .row .count {
      background: #ff2d55; color: #fff; border-radius: 9px;
      font-size: 10px; padding: 2px 6px; margin-top: 1px; min-width: 14px;
      text-align: center;
    }
    .row .count.zero { background: #bbb; }
    .bar { display: flex; gap: 8px; margin-top: 10px; }
    button {
      flex: 1; padding: 7px 6px; font-size: 12px; border-radius: 8px;
      border: 1px solid rgba(128,128,128,0.4); background: transparent; cursor: pointer;
    }
    button.on { background: #ff2d55; border-color: #ff2d55; color: #fff; }
    .total { margin-top: 10px; text-align: center; font-size: 12px; color: #888; }
    .warn {
      margin-top: 10px; font-size: 11px; color: #b00; line-height: 1.35;
    }
    .net {
      margin-top: 10px; font-size: 10.5px; color: #888; line-height: 1.4;
      border-top: 1px solid rgba(128,128,128,0.3); padding-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Quora Ad Shield</h1>
  <div class="ver" id="ver">loading…</div>
  <div id="modules"></div>
  <div class="bar">
    <button id="btn-debug">Debug: off</button>
    <button id="btn-reset">Reset counts</button>
  </div>
  <div class="bar">
    <button id="btn-pause">Pause all blocking</button>
  </div>
  <div class="total" id="total"></div>
  <div class="warn" id="warn" hidden></div>
  <div class="net">
    Network layer: also add <b>quora-network.txt</b> as a custom blocklist in
    Orion Settings → Content Blockers → Manage → Add New (paste its raw URL).
  </div>
  <script src="popup.js"></script>
</body>
</html>
